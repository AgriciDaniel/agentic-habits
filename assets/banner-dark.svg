    <text x="64" y="182" font-size="74" font-weight="700" letter-spacing="-2.4" fill="#FAFAF9">agentic habits</text>
    <text x="64" y="224" font-size="21" font-weight="400" fill="#A8A29E">An agent has no willpower and no memory. It has context.</text>
    <text x="64" y="256" font-size="21" font-weight="500" fill="#E8896A">So a habit is not repetition. It is placement.</text>
