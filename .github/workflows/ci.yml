name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: structure and house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structural checks
        run: bash .github/checks.sh

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and marketplace JSON
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          test "$(jq -r .name .claude-plugin/plugin.json)" = "habits"
          test "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)" = "habits"
          echo "manifests ok"
